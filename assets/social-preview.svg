<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="120" y1="160" x2="460" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.6" />

  <!-- Ambient glow -->
  <circle cx="240" cy="320" r="240" fill="#6366F1" fill-opacity="0.14" />
  <circle cx="1060" cy="180" r="220" fill="#06B6D4" fill-opacity="0.1" />

  <!-- Left emblem card -->
  <rect x="88" y="148" width="320" height="344" rx="28" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="2" />
  <rect x="116" y="176" width="264" height="42" rx="10" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="2" />
  <circle cx="138" cy="197" r="6" fill="#F59E0B" />
  <circle cx="160" cy="197" r="6" fill="#06B6D4" />
  <circle cx="182" cy="197" r="6" fill="#10B981" />

  <!-- Token swatches -->
  <rect x="120" y="244" width="66" height="54" rx="10" fill="#6366F1" stroke="#E2E8F0" stroke-width="2" />
  <rect x="120" y="314" width="66" height="54" rx="10" fill="#06B6D4" stroke="#E2E8F0" stroke-width="2" />
  <rect x="120" y="384" width="66" height="54" rx="10" fill="#F59E0B" stroke="#E2E8F0" stroke-width="2" />

  <!-- Ontology graph -->
  <path d="M292 268 L234 342 M292 268 L350 342 M350 342 L350 412 M234 342 L292 412" stroke="#06B6D4" stroke-width="5" stroke-linecap="round" />
  <circle cx="292" cy="264" r="22" fill="#6366F1" stroke="#F8FAFC" stroke-width="4" />
  <circle cx="234" cy="342" r="19" fill="#06B6D4" stroke="#F8FAFC" stroke-width="4" />
  <circle cx="350" cy="342" r="19" fill="#F59E0B" stroke="#F8FAFC" stroke-width="4" />
  <rect x="260" y="394" width="112" height="42" rx="12" fill="#10B981" stroke="#F8FAFC" stroke-width="3.5" />

  <!-- Right typography block -->
  <rect x="468" y="148" width="290" height="38" rx="19" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <text x="613" y="173" text-anchor="middle" fill="#38BDF8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" letter-spacing="0.04em">CLAUDE CODE + ANTIGRAVITY</text>

  <text x="468" y="272" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="84" font-weight="800" letter-spacing="-0.03em">Refract</text>

  <text x="468" y="330" fill="#CBD5E1" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="500">Extract W3C Design Tokens &amp; UI Ontology</text>
  <text x="468" y="368" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="400">from live website referents — zero npm dependencies.</text>

  <!-- Output chips -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">
    <rect x="468" y="422" width="128" height="40" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" />
    <text x="532" y="447" text-anchor="middle" fill="#E0E7FF">W3C DTCG</text>

    <rect x="610" y="422" width="116" height="40" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
    <text x="668" y="447" text-anchor="middle" fill="#CFFAFE">CSS Vars</text>

    <rect x="740" y="422" width="154" height="40" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <text x="817" y="447" text-anchor="middle" fill="#D1FAE5">Tailwind v4 / v3</text>

    <rect x="908" y="422" width="142" height="40" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <text x="979" y="447" text-anchor="middle" fill="#FEF3C7">UI Ontology</text>

    <rect x="1064" y="422" width="126" height="40" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="1127" y="447" text-anchor="middle" fill="#EDE9FE">DESIGN.md</text>
  </g>
</svg>
