name: Validate Plugin & Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check script syntax and executable permissions
        run: |
          for f in skills/extract-referent/scripts/*.js skills/extract-referent/scripts/*.mjs; do
            echo "Checking $f"
            node --check "$f"
            test -x "$f" || { echo "Missing executable permission on $f"; exit 1; }
          done

      - name: Validate plugin manifests and skill frontmatter
        run: |
          node -e '
            const fs = require("node:fs");
            const agy = JSON.parse(fs.readFileSync(".antigravity-plugin/plugin.json", "utf8"));
            const claude = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            const codex = JSON.parse(fs.readFileSync(".codex-plugin/plugin.json", "utf8"));
            const cursor = JSON.parse(fs.readFileSync(".cursor-plugin/plugin.json", "utf8"));
            for (const [label, m] of [["antigravity", agy], ["claude", claude], ["codex", codex], ["cursor", cursor]]) {
              if (m.name !== "refract") {
                throw new Error(`Manifest name mismatch in ${label}: ${m.name}`);
              }
              if (m.version !== agy.version) {
                throw new Error(`Manifest version mismatch in ${label}: ${m.version}`);
              }
            }
            const paths = [
              agy.logo,
              codex.skills,
              codex.interface.logo,
              codex.interface.composerIcon,
              cursor.logo,
              cursor.rules,
              cursor.skills,
              cursor.agents
            ];
            for (const p of paths) {
              if (!fs.existsSync(p)) {
                throw new Error("Missing referenced manifest path: " + p);
              }
            }
            if (!codex.interface.shortDescription || codex.interface.shortDescription.length > 30) {
              throw new Error("Codex interface.shortDescription must be 1..30 chars");
            }
            if (!Array.isArray(codex.interface.defaultPrompt) || codex.interface.defaultPrompt.length === 0 || codex.interface.defaultPrompt.length > 3) {
              throw new Error("Codex interface.defaultPrompt must be an array of 1..3 items");
            }
            const mdc = fs.readFileSync(".cursor/rules/refract-guardrails.mdc", "utf8");
            if (!/^---\n[\s\S]*?description:[\s\S]*?alwaysApply:\s*(true|false)\n---/m.test(mdc)) {
              throw new Error("Invalid frontmatter in .cursor/rules/refract-guardrails.mdc");
            }
            console.log("Manifests & Cursor .mdc OK:", agy.name, agy.version);
          '

      - name: Smoke test compile-artifacts.mjs and validate-artifacts.mjs
        run: |
          mkdir -p /tmp/refract-ci/raw
          cat > /tmp/refract-ci/raw/capture.json <<'EOF'
          {
            "schemaVersion": "1.0.0",
            "capturedAt": "2026-11-26T00:00:00.000Z",
            "url": "https://example.com",
            "primaryState": "desktop-light",
            "states": {
              "desktop-light": {
                "viewport": { "name": "desktop", "width": 1440, "height": 900 },
                "mode": "light",
                "meta": {
                  "url": "https://example.com",
                  "title": "CI Fixture",
                  "lang": "en",
                  "viewport": { "width": 1440, "height": 900, "devicePixelRatio": 1 },
                  "documentWidth": 1440,
                  "documentHeight": 1200,
                  "prefersColorScheme": "light"
                },
                "stylesheets": {
                  "customProperties": [
                    { "selector": ":root", "media": null, "name": "--brand-primary", "value": "#2563eb" }
                  ],
                  "fontFaces": [],
                  "breakpoints": ["(max-width: 768px)"],
                  "keyframes": [],
                  "crossOriginStylesheetsSkipped": 0
                },
                "computed": {
                  "elementsSampled": 20,
                  "colors": [
                    { "hex": "#ffffff", "role": "background", "count": 5, "totalArea": 1200000, "selectors": ["body"], "pairedBgs": {} },
                    { "hex": "#0f172a", "role": "text", "count": 8, "totalArea": 50000, "selectors": ["p"], "pairedBgs": { "#ffffff": 8 } },
                    { "hex": "#2563eb", "role": "accentCandidate", "count": 2, "totalArea": 4000, "selectors": ["button"], "pairedBgs": {} }
                  ],
                  "typography": [
                    { "fontFamily": "Inter, sans-serif", "fontSize": "16px", "fontWeight": "400", "lineHeight": "24px", "letterSpacing": "normal", "textTransform": "none", "count": 8, "tags": { "p": 8 }, "sampleText": "Sample body copy" },
                    { "fontFamily": "Inter, sans-serif", "fontSize": "36px", "fontWeight": "700", "lineHeight": "44px", "letterSpacing": "-0.02em", "textTransform": "none", "count": 1, "tags": { "h1": 1 }, "sampleText": "Hero Heading" }
                  ],
                  "spacing": { "padding": { "16px": 4, "24px": 2 }, "gap": { "16px": 2 }, "margin": {}, "maxWidth": { "1120px": 1 } },
                  "radii": { "8px": 3 },
                  "borderWidths": { "1px": 2 },
                  "shadows": {},
                  "backdropFilters": {},
                  "zIndices": [],
                  "motion": { "durations": { "0.15s": 2 }, "easings": { "ease": 2 }, "properties": { "background-color": 2 } }
                },
                "ontologyRaw": {
                  "regions": [
                    { "tag": "header", "role": "banner", "ariaLabel": null, "positioning": "sticky", "display": "flex", "box": { "x": 0, "y": 0, "width": 1440, "height": 64 }, "bg": "#ffffff", "childCount": 2, "selector": "header" },
                    { "tag": "main", "role": "main", "ariaLabel": null, "positioning": "static", "display": "block", "box": { "x": 160, "y": 64, "width": 1120, "height": 800 }, "bg": null, "childCount": 2, "selector": "main" }
                  ],
                  "components": [
                    { "archetype": "button", "instances": 2, "signature": { "background": "#2563eb", "color": "#ffffff", "border": "none", "radius": "8px", "padding": "12px 20px", "shadow": "none", "fontSize": "15px", "fontWeight": "600", "display": "inline-block" }, "slots": ["label"], "parentTags": ["main"], "childTags": [], "ariaStates": [], "sampleSelector": "button", "sampleText": "Get Started" }
                  ],
                  "headings": [{ "level": 1, "tag": "h1", "text": "Hero Heading", "fontSize": "36px", "fontWeight": "700" }],
                  "mediaAndIcons": { "svgCount": 0, "svgSizes": {}, "imgCount": 0, "imgAspectRatios": [] },
                  "touchTargets": { "totalChecked": 2, "under44pxCount": 0, "samples": [] },
                  "probeTargets": []
                },
                "interactionProbes": []
              }
            }
          }
          EOF
          node skills/extract-referent/scripts/compile-artifacts.mjs /tmp/refract-ci/raw/capture.json --out /tmp/refract-ci
          node skills/extract-referent/scripts/validate-artifacts.mjs /tmp/refract-ci
          rm -rf /tmp/refract-ci
